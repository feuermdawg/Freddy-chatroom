<!DOCTYPE html>
<html>
<head>
  <script type='text/javascript' src='https://cdn.scaledrone.com/scaledrone.min.js'></script>
  <!--<script type='text/javascript' src='http://0.0.0.0:8080/scaledrone.js'></script>-->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <style>
    p {
      color:white
    }
    body {
      background-color: #202020;
      box-sizing: border-box;
      margin: 0;
      padding: 13px;
      display: flex;
      flex-direction: column;
      max-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .members-count,
    .members-list,
    .messages {
      border: 1px solid #e4e4e4;
      padding: 15px;
      margin-bottom: 15px;
      font-size: 13px;
      color: white;
      max-height: 85vh
    }

    .messages {
      flex-shrink: 1;
      overflow: auto;
      color: white;
    }

    .message {
      padding: 5px 0;
    }
    .message .member {
      display: inline-block;
    }

    .member {
      padding-right: 10px;
      position: relative;
    }

    .message-form {
      display: flex;
      flex-shrink: 0;
    }
    .message-form__input {
      flex-grow: 1;
      border: 1px solid #dfdfdf;
      padding: 10px 15px;
      font-size: 16px;
    }
    .message-form__button {
      margin: 10px;
    }
    .small_button {
      --glow-color: rgb(217, 217, 217);
      --glow-spread-color: rgba(150, 150, 140, 0.651);
      --enhanced-glow-color: #D9D9D9;
      --btn-color: #242424;
      border: .25em solid var(--glow-color);
      padding: 1em 3em;
      color: var(--glow-color);
      font-size: 15px;
      font-weight: bold;
      background-color: var(--btn-color);
      border-radius: 1em;
      outline: none;
      box-shadow: 0 0 1em .25em var(--glow-color),
            0 0 4em 1em var(--glow-spread-color),
            inset 0 0 .75em .25em var(--glow-color);
      text-shadow: 0 0 .5em var(--glow-color);
      position: relative;
      transition: all 0.3s;
      flex: 0 1 auto;
      min-width: 100px;
    }
  </style>
</head>
<body id="backgroond">
  <script>
    function background(color) {
      document.getElementById('backgroond').style.backgroundColor = '#'+color
    }
  </script>
  <div class="members-count">-</div>
  <div class="members-list">-</div>
  <div class="messages"></div>
  <form class="message-form" onsubmit="return false;">
    <input class="message-form__input" placeholder="Type a message.." type="text"/>
    <input class="message-form__button" value="Send" type="submit"/>
  </form>
  <script src="./script.js"></script>
  <p>Theos chat room<br>1. no lying<br>2. be nice<br>3. gian and ian are not allowed, if they come say h8i for ian or be mean to gian<br><br>In order to use images, type img: before an image address</p>
  <a href="./eaglercraft1-8.html">Minecraft, because peeboy asked for it :)</a>
  <button onclick="background(prompt())" class="small_button">background changer</button>
</body>
</html>
